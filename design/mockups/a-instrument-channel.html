<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=412">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
:root{--bg:#0B0F12;--s:#12181D;--l:#1E2830;--t:#E6EDF0;--m:#7C8B94;--x:#FF7A7A;--y:#4FD1C5;--z:#7AA2FF;--cap:#FF5D5D}
*{box-sizing:border-box;margin:0}body{width:412px;height:915px;background:var(--bg);color:var(--t);font:14px Inter,sans-serif;overflow:hidden;position:relative}
.sb{display:flex;justify-content:space-between;padding:10px 20px 0;font:600 13px Inter;color:var(--m)}
.top{display:flex;align-items:center;gap:12px;padding:14px 18px 6px}.back{font-size:20px;color:var(--m)}
h1{font:700 20px Inter}.sub{font:12px 'JetBrains Mono';color:var(--m);padding:0 18px 12px}
.scope{margin:0 12px;background:var(--s);border:1px solid var(--l);border-radius:16px;height:300px;position:relative;overflow:hidden}
.scope svg{position:absolute;inset:0}.lg{position:absolute;top:10px;left:12px;display:flex;gap:10px;font:600 11px 'JetBrains Mono'}
.read{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px}
.r{background:var(--s);border:1px solid var(--l);border-radius:12px;padding:10px}.r .n{font:600 11px Inter;color:var(--m)}.r .v{font:600 20px 'JetBrains Mono';margin-top:4px}
.sec{font:600 11px Inter;letter-spacing:.6px;text-transform:uppercase;color:var(--m);padding:8px 18px 6px}
.fft{margin:0 12px;height:86px;background:var(--s);border:1px solid var(--l);border-radius:12px;display:flex;align-items:flex-end;gap:2px;padding:10px}.fft i{flex:1;background:var(--y);border-radius:1px}
.peak{position:absolute;right:28px;margin-top:-80px;font:11px 'JetBrains Mono';color:var(--y)}
.acts{display:flex;gap:8px;padding:14px 12px}.btn{flex:1;text-align:center;padding:13px 6px;border-radius:14px;border:1px solid var(--l);background:var(--s);font-weight:600;font-size:13px}
.btn.rec{background:var(--cap);border-color:var(--cap);color:#fff}
.ask{margin:0 12px;border:1px dashed #2C3A44;border-radius:14px;padding:12px 14px;color:var(--m);font-size:13px}.ask b{color:var(--t)}
</style></head><body>
<div class="sb"><span>19:58</span><span>5G ▲ 43%</span></div>
<div class="top"><span class="back">←</span><h1>Accelerometer</h1></div>
<div class="sub">icm456xy · 395 Hz measured · ±8 g · 0.0012 m/s² steps</div>
<div class="scope" id="scope"><div class="lg"><span style="color:var(--x)">x 0.12</span><span style="color:var(--y)">y 9.79</span><span style="color:var(--z)">z 0.31</span></div></div>
<div class="read"><div class="r"><div class="n">RMS</div><div class="v">0.41</div></div><div class="r"><div class="n">Peak</div><div class="v">2.36</div></div><div class="r"><div class="n">Rate</div><div class="v">395</div></div></div>
<div class="sec">Spectrum</div><div class="fft" id="fft"></div><div class="peak">peak 23.4 Hz</div>
<div class="acts"><div class="btn rec">● Log to file</div><div class="btn">Overlay on video</div><div class="btn">CSV</div></div>
<div class="ask">✦ <b>Ask the agent:</b> "what's vibrating at 23 Hz?"</div>
<script src="_common.js"></script><script>
const w=386,h=300,g=[];for(let i=1;i<6;i++)g.push(`<line x1="0" x2="${w}" y1="${i*h/6}" y2="${i*h/6}" stroke="#1E2830"/>`);
for(let i=1;i<8;i++)g.push(`<line y1="0" y2="${h}" x1="${i*w/8}" x2="${i*w/8}" stroke="#1E2830"/>`);
const tr=(v,c,o)=>`<path d="${path(v.map(x=>x+o),w,h,-3,3)}" fill="none" stroke="${c}" stroke-width="1.5"/>`;
scope.insertAdjacentHTML('beforeend',`<svg width="${w}" height="${h}">${g.join('')}${tr(wave(160,.55,.5,.5,3),'#FF7A7A',1.4)}${tr(wave(160,.55,.35,.3,8),'#4FD1C5',0)}${tr(wave(160,.55,.4,.4,5),'#7AA2FF',-1.4)}</svg>`);
fft.innerHTML=Array.from({length:48},(_,i)=>{const p=Math.exp(-Math.pow(i-12,2)/6)*0.9+Math.exp(-Math.pow(i-25,2)/4)*0.35+0.06+((i*37)%11)/110;return `<i style="height:${Math.min(100,p*100).toFixed(0)}%"></i>`}).join('');
</script></body></html>
