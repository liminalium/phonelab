name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/phonelab.apk
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: phonelab-${{ env.VERSION }}
          path: out/phonelab.apk

      # The asset keeps one name, so .../releases/latest/download/phonelab.apk always works.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" out/phonelab.apk \
            --title "PhoneLab $VERSION" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"

  # Runs the APK on emulators: Android 15 like the target moto g55, and
  # Android 10, the oldest version the app supports. Each run is a crash check
  # plus screenshots of every screen, saved as an artifact.
  emulator:
    needs: apk
    runs-on: ubuntu-latest
    name: emulator (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android15
            api: 35
            profile: pixel_6
          - name: android10
            api: 29
            profile: pixel_3a
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: phonelab-${{ env.VERSION }}
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash scripts/screenshots.sh out/phonelab.apk screenshots

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.name }}-${{ env.VERSION }}
          path: screenshots
